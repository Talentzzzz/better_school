server:
  port: 8080
  # 优雅停机：先让 Tomcat 停止接新连接，再触发 DisposableBean → 合并器排空
  shutdown: graceful
  tomcat:
    # spring.threads.virtual.enabled=true 时每请求一个虚拟线程，threads.max 不再生效，
    # 真正的承接上限是 max-connections + accept-count；这里调大仅作兜底声明
    threads:
      max: 2000
      min-spare: 50
    accept-count: 5000
    max-connections: 32768
    max-keep-alive-requests: 10000

spring:
  application:
    name: inventory-l2w256
  threads:
    virtual:
      enabled: true          # JDK21 虚拟线程：每次请求一条，park 在 future 上不占载体线程
  jackson:
    default-property-inclusion: non_null
  lifecycle:
    timeout-per-shutdown-phase: 20s

stock:
  datasource:
    host: ${MYSQL_HOST:127.0.0.1}
    port: ${MYSQL_PORT:3306}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root123}
    database: ${MYSQL_DATABASE:inventory_demo}

  # 连接池：20 不是「越大越快」，见 StockProperties.Pool 的注释
  pool:
    maximum-pool-size: ${POOL_MAX:20}
    minimum-idle: ${POOL_MIN_IDLE:20}
    connection-timeout-ms: ${POOL_CONNECTION_TIMEOUT_MS:2000}
    # >0=启动时连不上库就直接失败（默认）；-1=允许启动并持续重试（DB 未就绪 / 靠探针兜底时用）
    initialization-fail-timeout: ${POOL_INITIALIZATION_FAIL_TIMEOUT:1}

  merge:
    # 分片数：2 的幂，≈ 峰值并发热点数（256 片在 512 热点时每片 2 个 SKU）
    shard-count: ${MERGE_SHARD_COUNT:256}
    # 合并窗口：首个请求排定 5ms 后 flush，攒满 200 可提前
    window-ms: ${MERGE_WINDOW_MS:5}
    max-batch: ${MERGE_MAX_BATCH:200}
    # 等待上限：100ms；调到 200 可把高并发下的超时率砍半，代价是 p99 到 200ms
    wait-timeout-ms: ${MERGE_WAIT_TIMEOUT_MS:100}
    # 单分片缓冲区上限：256 × 10000 ≈ 20MB 引用
    shard-capacity: ${MERGE_SHARD_CAPACITY:10000}
    # ★ 必须等于 pool.maximum-pool-size，启动时强校验（大于池 = 抢连接，小于池 = 连接闲置）
    flush-threads: ${MERGE_FLUSH_THREADS:20}
    # ★ 售罄短路：必开。不开时售罄路径 200 件要走 399 次事务（实测 4,611 → 21,060）
    soldout-shortcut: ${MERGE_SOLDOUT_SHORTCUT:true}
    # 停机 / 复位前排空在途请求的等待上限
    drain-timeout-ms: ${MERGE_DRAIN_TIMEOUT_MS:5000}

logging:
  level:
    root: INFO
    cn.inventory: INFO

# 压测/运维观测：/actuator/metrics 下可实时读 hikaricp.connections.*、jvm.gc.pause、
# 以及自定义的 stock.pool.waiting / stock.merge.pending
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: inventory-l2w256
