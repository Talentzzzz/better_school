# RocketMQ broker 配置（compose 挂载，5.x）
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
deleteWhen=04
fileReservedTime=48
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
# 自动创建 topic（联调方便，生产应关闭）
autoCreateTopicEnable=true
# namesrv 地址由 compose 环境变量 NAMESRV_ADDR 提供（5.x 镜像优先读环境变量）
listenPort=10911
storePathRootDir=/home/rocketmq/store
storePathCommitLog=/home/rocketmq/store/commitlog
# 关键：注册给 namesrv 的对外地址。
# 当前部署模式 = 应用宿主机 IDE 跑（用户拍板）：brokerIP1=127.0.0.1，客户端连
# localhost:10911 经端口映射到容器（实测 Docker Desktop 虚拟网关 10.122.202.100 不通，
# 2026-08-30 踩坑从 host.docker.internal 改为 127.0.0.1）。
# 若未来应用也容器化（compose 网络内），需改回 host.docker.internal（broker 已配 extra_hosts host-gateway）
brokerIP1=127.0.0.1
